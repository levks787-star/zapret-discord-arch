# Фрагмент /opt/zapret2/config для Discord (zapret2 v1.0.6, AUR zapret2).
# Все параметры nfqws2 взяты из upstream: config.default, docs/readme.md (пример preset2),
# init.d/custom.d.examples.linux/50-discord-media. Проверено: nfqws2 --dry-run.
# install.sh дописывает этот блок в конец /opt/zapret2/config (переопределяет значения выше).

# --- zapret2-discord BEGIN ---
FWTYPE=nftables
NFQWS2_ENABLE=1
MODE_FILTER=hostlist
# 2053,2083,2087,2096,8443 - discord.media (как в Flowseal general.bat)
NFQWS2_PORTS_TCP=80,443,2053,2083,2087,2096,8443
# 19294-19344,50000-50100 - голос Discord (STUN / IP discovery)
NFQWS2_PORTS_UDP=443,19294-19344,50000-50100
NFQWS2_OPT="
--filter-tcp=80 --filter-l7=http <HOSTLIST> --payload=http_req --lua-desync=fake:blob=fake_default_http:tcp_md5 --lua-desync=multisplit:pos=method+2 --new
--filter-tcp=443,2053,2083,2087,2096,8443 --filter-l7=tls <HOSTLIST> --out-range=-d10 --payload=tls_client_hello --lua-desync=fake:blob=fake_default_tls:tcp_md5:tcp_seq=-10000:repeats=6 --lua-desync=multidisorder:pos=1,midsld --new
--filter-udp=443 --filter-l7=quic <HOSTLIST_NOAUTO> --payload=quic_initial --lua-desync=fake:blob=fake_default_quic:repeats=6 --new
--filter-udp=19294-19344,50000-50100 --filter-l7=discord,stun --payload=stun,discord_ip_discovery --lua-desync=fake:blob=0x00000000000000000000000000000000:repeats=2
"
# --- zapret2-discord END ---
